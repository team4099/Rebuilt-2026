plugins {
	id "java"
	id "application"
	id "org.wpilib.GradleRIO" version "2027.0.0-alpha-8"
	id "org.jetbrains.kotlin.jvm" version "2.3.0"
	id "com.diffplug.spotless" version "6.25.0"
	id "com.peterabeles.gversion" version "1.10"
	id "org.jetbrains.kotlinx.kover" version "0.8.3"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

def TEAM = 4099
// do not change main class (does not run without it being Main
def ROBOT_MAIN_CLASS = "com.team4099.robot2026.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
	targets {
		systemcore(getTargetTypeClass('SystemCore')) {
			// Team number is loaded either from the .wpilib/wpilib_preferences.json
			// or from command line. If not found an exception will be thrown.
			// You can use getTeamOrDefault(team) instead of getTeamNumber if you
			// want to store a team number in this file.
			team = project.wpilib.getTeamNumber()
			// Use the default systemcore host name. This must be called after setting team
			// as happens on the line above
			useDefaultSystemcoreHostName()
			debug = project.wpilib.getDebugOrDefault(false)

			artifacts {
				// First part is artifact name, 2nd is artifact type
				// getTargetTypeClass is a shortcut to get the class type using a string

				wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
					jvmArgs.add("-Dcom.sun.management.jmxremote=true")
					jvmArgs.add("-Dcom.sun.management.jmxremote.port=1198")
					jvmArgs.add("-Dcom.sun.management.jmxremote.local.only=false")
					jvmArgs.add("-Dcom.sun.management.jmxremote.ssl=false")
					jvmArgs.add("-Dcom.sun.management.jmxremote.authenticate=false")
					jvmArgs.add("-Djava.rmi.server.hostname=10.40.99.2")
					// Set to true to use debug including JNI, which will drastically impact performance.
					debugJni = false
				}
				// Static files artifact
				wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
					files = project.fileTree('src/main/deploy')
					directory = '/home/systemcore/deploy'
					deleteOldFiles = false // Change to true to delete files on systemcore that no
					// longer exist in deploy directory of this project
				}
			}
		}
	}
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava
// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.

repositories {
	mavenCentral()
	maven { url "https://jitpack.io" }
}


configurations {
	falconUtilsBundle { transitive = false }
}

def falconUtilsJar = tasks.register('falconUtilsJar', Jar) {
	archiveClassifier = 'falconutils-only'
	from({ zipTree(configurations.falconUtilsBundle.singleFile) }) {
		include 'org/team4099/**', 'META-INF/FalconUtils.kotlin_module'
		exclude 'org/team4099/lib/pplib/**'
	}
}

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.



// Configuration for AdvantageKit
task(replayWatch, type: JavaExec) {
	mainClass = "org.littletonrobotics.junction.ReplayWatch"
	classpath = sourceSets.main.runtimeClasspath
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
	annotationProcessor wpi.java.deps.wpilibAnnotations()
	implementation wpi.java.deps.wpilib()
	implementation wpi.java.vendor.java()

	systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
	systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

	systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
	systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

	nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
	nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
	simulationDebug wpi.sim.enableDebug()

	nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
	nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
	simulationRelease wpi.sim.enableRelease()

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	falconUtilsBundle 'com.github.team4099:FalconUtils:2.0.0-beta.2'
	implementation files(falconUtilsJar)
	implementation 'org.wpilib.thirdparty.opencv:opencv-java:2027-4.13.0-3'
	implementation 'org.wpilib.apriltag:apriltag-java:2027.0.0-alpha-8'
	implementation 'org.wpilib.commandsv2:commandsv2-java:2027.0.0-alpha-8'
	implementation 'org.apache.commons:commons-collections4:4.0'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation "io.javalin:javalin:5.3.2"
	implementation "gov.nist.math:jama:1.0.3"

	implementation "org.tribuo:tribuo-core:4.3.2"
	implementation "org.tribuo:tribuo-classification-core:4.3.2"
	implementation "org.tribuo:tribuo-clustering-core:4.3.2"
	implementation "org.tribuo:tribuo-clustering-hdbscan:4.3.2"
	implementation "org.tribuo:tribuo-math:4.3.2"

	def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
	annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}
test {
	useJUnitPlatform()
	systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()
application.mainClass = ROBOT_MAIN_CLASS


deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)
// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	from('src') { into 'backup/src' }
	from('vendordeps') { into 'backup/vendordeps' }
	from('build.gradle') { into 'backup' }
	manifest org.wpilib.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}


tasks.withType(JavaCompile) {
	options.compilerArgs.add '-XDstringConcat=inline'
}
spotless {
	format 'misc', {
		// define the files to apply `misc` to
		target '*.gradle', '*.md', '.gitignore'

		// define the steps to apply to those files
		trimTrailingWhitespace()
		indentWithTabs() // or spaces. Takes an integer argument if you don't like 4
		endWithNewline()
	}
	kotlin {
		// by default the target is every '.kt' and '.kts` file in the java sourcesets
		target fileTree(".") {
			include "**/*.kt"
			exclude "**/BuildConstants.kt", "**/build/**", "**/bin/**", "src/main/kotlin/com/team4099/lib/sim/**"
		}
		ktfmt()
	}
}

wrapper {
	gradleVersion = '9.4.1'
}

// Configure jar and deploy tasks
wpi.java.configureTestTasks(test)


// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
	options.compilerArgs.add '-XDstringConcat=inline'
}

compileKotlin {
	kotlinOptions {
		jvmTarget = "25"
	}
}

compileJava{

}

gversion {
	srcDir       = "src/main/kotlin/"           // path is relative to the sub-project by default
	// Gradle variables can also be used
	// E.g. "${project.rootDir}/module/src/main/java"
	classPackage = "com.team4099.robot2026"
	className    = "BuildConstants"                // optional. If not specified GVersion is used
	dateFormat   = "yyyy-MM-dd'T'HH:mm:ss'Z'" // optional. This is the default
	timeZone     = "EST"                      // optional. UTC is default
	debug        = false                      // optional. print out extra debug information
	language     = "kotlin"                     // optional. Can be Java, Kotlin, YAML, or Properties. Case insensitive.
	explicitType = false                      // optional. Force types to be explicitly printed
	indent       = "\t"                       // optional. Change how code is indented. 1 tab is default.
	annotate     = false                      // optional. Java only. Adds @Generated annotation
}


project.compileKotlin.dependsOn(createVersionFile)
project.compileJava.dependsOn(createVersionFile)
// Configure jar and deploy tasks
wpi.java.configureTestTasks(test)

task(eventDeploy) {
	doLast {
		if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
			def branchPrefix = "event"
			def branch = 'git branch --show-current'.execute().text.trim()
			def commitMessage = "Update at '${new Date().toString()}'"

			if (branch.startsWith(branchPrefix)) {
				exec {
					workingDir(projectDir)
					executable 'git'
					args 'add', '-A'
				}
				exec {
					workingDir(projectDir)
					executable 'git'
					args 'commit', '-m', commitMessage
					ignoreExitValue = true
				}

				println "Committed to branch: '$branch'"
				println "Commit message: '$commitMessage'"
			} else {
				println "Not on an event branch, skipping commit"
			}
		} else {
			println "Not running deploy task, skipping commit"
		}
	}
}
createVersionFile.dependsOn(eventDeploy)

def argSpec = [
		robot: [
				allowed: ["compbot", "alphabot", "testbot"],
				required: true
		],
		tuning: [
				allowed: ["true", "t", "false", "f"],
				required: true,
		],
]

tasks.register("validateArgs") {
	doFirst {
		argSpec.each { key, spec ->
			def value = project.findProperty(key) ?: spec.default

			if (value == null && spec.required) {
				throw new GradleException("Missing required argument: -P$key. Allowed: ${spec.allowed}")
			}

			if (spec.allowed && !spec.allowed.contains(value.toLowerCase())) {
				throw new GradleException(
						"Invalid -P$key=$value. Allowed: ${spec.allowed}"
				)
			}

			if (spec.pattern && !(value ==~ spec.pattern)) {
				throw new GradleException(
						"Invalid -P$key=$value. Must match ${spec.pattern}"
				)
			}
		}
	}
}

["simulateJava", "deploy"].each { taskName ->
	tasks.named(taskName).configure {
		dependsOn validateArgs
	}
}

tasks.withType(JavaExec).configureEach {
	argSpec.keySet().each { key ->
		def value = project.findProperty(key) ?: argSpec[key].default
		if (value != null) {
			systemProperty key.toLowerCase(), value
		}
	}
}

argSpec.keySet().each { key ->
	def value = project.findProperty(key) ?: argSpec[key].default
	if (value != null) {
		// add to roboRIO JVM args (so the robot JVM will see System.getProperty(key))
		deployArtifact.jvmArgs.add("-D${key.toLowerCase()}=${value}")

		// keep existing behaviour for local JavaExec tasks (simulate/run)
		tasks.withType(JavaExec).configureEach {
			systemProperty key.toLowerCase(), value
		}
	}
}
